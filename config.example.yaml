# ============================================================================
#  域名监控 + 自动抢注  配置模板
#  复制成 config.yaml 后修改。所有 ${VAR} 都会从环境变量读取，
#  密钥请放环境变量或 .env，不要直接写进这个文件提交到仓库。
# ============================================================================

# 数据存放位置（SQLite + RDAP bootstrap 缓存）
state_dir: "./data"
database: "domain-monitor.db"
log_level: "INFO"
# log_file: "./data/monitor.log"

# ---------------------------------------------------------------- 监控的域名
# 支持花括号写法一次写一批：mydream.{com,net,io}
# 也能用预设合集：vps.{@all} 一次盯全部无限制后缀（58 个）
# 只要两位的用 @two，只要通用后缀用 @gtld（domain_monitor tlds 可查看）
domains:
  - example.com                      # 简写形式
  - name: mydream.io                 # 完整形式，可以单独覆盖参数
    # auto_buy: true                 # 单独指定这个域名是否自动下单
    max_price: 80                    # 这个域名最多愿意花多少钱
    years: 1
    note: "主力目标"
  - name: 短域名.cn
    max_price: 100

# ------------------------------------------------- 前缀监控（一个名字，多个后缀）
# 「这个名字我要，哪个后缀都行」——展开成一批域名一起盯。
# stop_after_first: true 表示抢到其中任意一个之后，同组其余的自动停止监控。
# prefixes:
#   - name: mydream               # 也可以写成列表 [mydream, dreamy]
#     tlds: ["@all"]             # 支持 @合集，也能和具体后缀混写
#     max_price: 80
#     stop_after_first: true      # 默认就是 true
#     auto_buy: false             # 整组只通知不买
#   - name: [short, tiny]
#     tlds: [com]
#     stop_after_first: false     # 每个都想要，就关掉

# 自定义后缀合集，写了同名的会覆盖内置合集
# tld_groups:
#   我的组: [com, io, ai, xyz]
#   便宜: [xyz, top, icu, shop]

# 一条模式最多能展开出多少个域名，防手滑
pattern_limit: 200

# ---------------------------------------------------------------- 轮询节奏
# 按「距离预测释放时间还有多久」自动分档提速，单位都是秒。
poll:
  idle_interval: 21600      # 平时 6 小时查一次（RDAP 有速率限制，别调太猛）
  watch_interval: 1800      # 已进入删除流程：30 分钟
  near_interval: 60         # 临近释放：1 分钟
  sprint_interval: 1        # 冲刺档（没装 dnspython 时的兜底间隔）
  watch_lead: 259200        # 距释放 3 天 → watch 档
  near_lead: 7200           # 距释放 2 小时 → near 档
  sprint_lead: 300          # 距释放 5 分钟 → sprint 档
  sprint_tail: 5400         # 过了预测时间再冲 90 分钟
  jitter: 0.15              # 间隔随机抖动 ±15%，避免整点齐射
  concurrency: 8            # 并发查询数
  error_backoff: 300        # 查询失败后至少等这么久再重试

# ---------------------------------------------------------------- RDAP 查询
rdap:
  bootstrap_url: "https://data.iana.org/rdap/dns.json"
  fallback_service: "https://rdap.org/"   # bootstrap 拉不到时的兜底入口
  bootstrap_ttl: 86400
  timeout: 15
  rps_per_host: 1.0         # 每个 RDAP 服务器每秒最多几次请求 —— 别调高，会被封
  burst_per_host: 3.0
  max_retries: 2
  # 「已注册」直接跳到「可注册」很可疑（多半是服务器抽风），先复核一次再当真。
  # 走完删除流程掉出来的属于预期内，不会复核，抢注速度不受影响。
  reverify_available: true
  reverify_delay: 3.0
  # 个别后缀的 RDAP 地址可以在这里覆盖
  overrides: {}
  #   cn: "https://rdap.cnnic.cn/"

# ---------------------------------------------------------------- DNS 探测
# 冲刺阶段用它替代 RDAP 高频轮询：直接问 TLD 权威服务器要 NS 记录，
# NXDOMAIN 说明注册局里已经没这条委派了 —— 域名被删除的强信号。
dns:
  enabled: true
  timeout: 2
  interval: 0.5             # 冲刺时每 0.5 秒探一次
  cache_ttl: 3600
  resolvers: []             # 留空 = 自动用该 TLD 的权威服务器

# ---------------------------------------------------------------- Telegram
telegram:
  enabled: false            # ← 填好下面的 bot_token / chat_id 后改成 true
  bot_token: "${TG_BOT_TOKEN}"        # 找 @BotFather 申请
  chat_id: "${TG_CHAT_ID}"            # 找 @userinfobot 拿你的 id
  allowed_user_ids: []                # 只允许这些 user id 发命令；留空则只认 chat_id
  commands: true                      # 开启 /add /list /buy 等双向命令（也支持直接发域名）
  poll_timeout: 30
  silent_idle: true         # 非紧急状态变化静音推送（不震手机），可注册/待删除仍会正常提醒
  # 哪些状态变化要推送（其余只记日志）
  notify_states: ["expired", "redemption", "pending_delete", "available", "acquired"]

# ---------------------------------------------------------------- 抢注行为
purchase:
  enabled: false            # ← 总开关（这里给的是默认值，之后可在 TG 里用 /mode 切换）
  dry_run: true             # ← 演练开关。改 false 才会真的花钱！
  allow_remote_control: true  # 允许在 Telegram 里用 /mode 切换下单模式？
                            # 关掉的话配置文件是唯一权威，改模式必须登服务器
  years: 1
  max_price: 50             # 单个域名价格上限（超过就放弃，防溢价域名天价）
  daily_budget: 200         # 每日累计消费上限（金额）
  max_per_day: 3            # 每日最多买几个（笔数）——这条比金额上限更重要！
                            # 你盯的一批后缀里往往有好几个本来就没人注册，
                            # 开关一开会被一次性全买走，金额预算拦不住
  auto_buy_default: true    # 没单独标 auto_buy 的域名，默认自动买吗？
                            # 改成 false 就是「白名单模式」：
                            # 只有显式写了 auto_buy: true 的才会被下单
  currency: "USD"
  max_attempts: 120         # 单次冲刺最多下单几次
  attempt_interval: 0.5     # 两轮下单之间的间隔
  attempt_concurrency: 3    # 并发下单通道数
  attempt_window: 900       # 冲刺下单最长持续时间
  check_price_first: true   # 下单前先查价（注册商支持时）
  compare_prices: true      # 配了多个注册商时并发比价，挑最便宜的一家下单
  parallel_registrars: true # 冲刺时同时向所有通道下单，先成功者胜（不会重复扣款，见 README）
  skip_rdap_confirm: true   # 冲刺时 DNS 命中即下单；改 false 会先用 RDAP 复核（更稳但慢一个往返）
  confirm_via_telegram: false  # 下单前要在 TG 点确认 —— 会慢几秒，抢热门域名别开
  confirm_timeout: 60
  whois_privacy: true
  auto_renew: false
  stop_after_success: true  # 抢到后从监控列表摘掉
  nameservers: []           # 留空用注册商默认 NS
  #   - ns1.example.com
  #   - ns2.example.com

# ---------------------------------------------------------------- 注册商
# 可选: dryrun / namesilo / dynadot / godaddy / namecheap / aliyun / exec
registrar:
  provider: "dryrun"
  timeout: 20

  # --- dryrun：演练用假注册商，不会花钱 -------------------------------------
  options:
    price: 9.99
    fail_times: 2           # 模拟前 2 次「域名还没释放」

  # --- namesilo（GET+XML，最简单，走账户余额扣款）---------------------------
  # options:
  #   api_key: "${NAMESILO_API_KEY}"
  #   sandbox: false

  # --- dynadot（响应快，抢注常用，需在后台开 API 并绑定 IP 白名单）----------
  # options:
  #   api_key: "${DYNADOT_API_KEY}"
  #   currency: "usd"

  # --- godaddy（生产 API 有账户门槛，先用 ote 沙箱跑通）---------------------
  # options:
  #   api_key: "${GODADDY_KEY}"
  #   api_secret: "${GODADDY_SECRET}"
  #   ote: true

  # --- namecheap（必须把出口 IP 加进后台白名单，client_ip 填错是最常见的坑）--
  # options:
  #   api_user: "${NC_API_USER}"
  #   api_key: "${NC_API_KEY}"
  #   client_ip: "1.2.3.4"
  #   sandbox: false

  # --- aliyun 阿里云/万网（国内 + .cn 首选，需账户余额 + 已实名的信息模板）--
  # options:
  #   access_key_id: "${ALIYUN_AK}"
  #   access_key_secret: "${ALIYUN_SK}"
  #   registrant_profile_id: "123456"

  # --- exec：调你自己的脚本，接任何没内置的注册商（不经过 shell）------------
  # options:
  #   command: ["/opt/scripts/buy.sh"]
  #   check_command: ["/opt/scripts/check.sh"]
  #   timeout: 30

  # 联系人资料 —— godaddy / namecheap 下单必填
  contact: {}
  #   first_name: "San"
  #   last_name: "Zhang"
  #   email: "you@example.com"
  #   phone: "+86.13800138000"        # 注意格式 +国家码.号码
  #   address1: "XX 路 1 号"
  #   city: "Shanghai"
  #   state: "Shanghai"
  #   postal_code: "200000"
  #   country: "CN"
  #   organization: ""

# ------------------------------------------------------- 多注册商（比价 / 多通道）
# 配了这个列表就会**覆盖**上面单数的 registrar，好处有两个：
#   1. 比价：下单前并发问每家要价，挑最便宜的一家买（用的是你账户的真实成交价）
#   2. 多通道抢注：冲刺时同时向所有通道下单，先成功者胜。
#      同一域名在注册局只能注册一次，所以并发不会重复扣款，但成功率明显更高。
# 每家都要事先开户、充值、配好 API —— 抢注时来不及现场注册账号。
# registrars:
#   - provider: namesilo
#     options:
#       api_key: "${NAMESILO_API_KEY}"
#   - provider: dynadot
#     options:
#       api_key: "${DYNADOT_API_KEY}"
#   - provider: aliyun
#     options:
#       access_key_id: "${ALIYUN_AK}"
#       access_key_secret: "${ALIYUN_SK}"
#       registrant_profile_id: "123456"

# ---------------------------------------------------------------- 删除周期
# 用来预测「什么时候会被释放」，进而决定何时提速。
# 默认值来自 ICANN 到期恢复政策：45 天续费宽限期 + 30 天赎回期 + 5 天 pendingDelete。
# drop_window 是社区经验窗口（UTC），注册局并不承诺固定时刻，
# 它只影响「几点开始高频探测」，不影响判断正确性。
lifecycle:
  default:
    grace_days: 45
    redemption_days: 30
    pending_delete_days: 5
  tlds: {}
  #   com:
  #     drop_window_start: "17:30"
  #     drop_window_end: "20:30"
  #   cn:
  #     grace_days: 30
