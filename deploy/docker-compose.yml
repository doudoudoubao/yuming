services:
  domain-monitor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: domain-monitor:latest
    container_name: domain-monitor
    restart: unless-stopped
    volumes:
      # 把 config.yaml 和 SQLite 数据都放在宿主机的 ./data 里
      - ./data:/data
    environment:
      # 密钥统一从宿主机环境或 .env 文件注入，不要写进 config.yaml
      TG_BOT_TOKEN: "${TG_BOT_TOKEN}"
      TG_CHAT_ID: "${TG_CHAT_ID}"
      # 注册商凭据：只需要填你实际用的那一家
      # 各家要填什么：docker compose exec domain-monitor \
      #   python -m domain_monitor registrar
      NAMESILO_API_KEY: "${NAMESILO_API_KEY:-}"
      DYNADOT_API_KEY: "${DYNADOT_API_KEY:-}"
      ALIYUN_ACCESS_KEY_ID: "${ALIYUN_ACCESS_KEY_ID:-}"
      ALIYUN_ACCESS_KEY_SECRET: "${ALIYUN_ACCESS_KEY_SECRET:-}"
      ALIYUN_REGISTRANT_PROFILE_ID: "${ALIYUN_REGISTRANT_PROFILE_ID:-}"
      GODADDY_API_KEY: "${GODADDY_API_KEY:-}"
      GODADDY_API_SECRET: "${GODADDY_API_SECRET:-}"
      NAMECHEAP_API_USER: "${NAMECHEAP_API_USER:-}"
      NAMECHEAP_API_KEY: "${NAMECHEAP_API_KEY:-}"
      NAMECHEAP_CLIENT_IP: "${NAMECHEAP_CLIENT_IP:-}"
